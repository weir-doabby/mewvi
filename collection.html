<!DOCTYPE html>
<html class="dark" dir="rtl" lang="fa">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport">
  <title>مجموعه برگزیده | Mewvi</title>
  
  <script src="js/tailwind.min.js"></script>
  <link rel="stylesheet" href="css/vazirmatn.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appDark: '#0a0a0f',
            cardDark: '#12121a',
            surfaceDark: '#181824',
            brandRed: '#EF4444',
            brandRedHover: '#DC2626',
            brandYellow: '#FBBF24'
          },
          fontFamily: {
            sans: ['Vazirmatn', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    html, body, button, input, select, textarea {
      font-family: 'Vazirmatn', system-ui, -apple-system, sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-appDark text-white font-sans antialiased pb-20 min-h-screen">

  <!-- Minimal Sticky Header -->
  <header class="sticky top-0 z-50 bg-appDark/95 backdrop-blur-md border-b border-white/10 px-4 py-3 transition-all">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Back Arrow Button (No text, just icon) -->
        <a href="index.html" class="w-9 h-9 flex-shrink-0 rounded-xl bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 flex items-center justify-center transition shadow cursor-pointer" title="بازگشت">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <div class="h-4 w-px bg-white/10 hidden sm:block"></div>
        <div class="flex items-center gap-2 min-w-0">
          <span class="w-2.5 h-2.5 rounded-full bg-brandRed flex-shrink-0"></span>
          <h1 id="pageHeaderTitle" class="text-sm sm:text-base font-extrabold text-white truncate">مجموعه برگزیده</h1>
        </div>
      </div>

      <div class="flex items-center gap-2 flex-shrink-0">
        <span id="resultCountBadge" class="text-xs font-bold text-gray-400 bg-white/5 border border-white/10 px-2.5 py-1 rounded-xl">۰ اثر</span>
      </div>
    </div>
  </header>

  <!-- Simple Search Bar (No hero box, no descriptions) -->
  <section class="max-w-7xl mx-auto px-4 pt-4 pb-2">
    <div class="relative w-full sm:max-w-md">
      <input id="searchInput" type="text" placeholder="جستجو در این بخش..." class="w-full bg-white/5 border border-white/10 focus:border-brandRed rounded-xl py-2 pr-9 pl-3 text-xs sm:text-sm text-white placeholder-gray-400 focus:outline-none transition shadow-inner">
      <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
    </div>
  </section>

  <!-- Movies Grid Container (Normal Mewvi Cards, No Extra Buttons) -->
  <main class="max-w-7xl mx-auto px-4 pt-3">
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 sm:gap-4">
      <!-- Dynamically Rendered by JS -->
    </div>

    <!-- Empty State -->
    <div id="emptyState" class="hidden text-center py-16 px-4">
      <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center mx-auto mb-3 text-gray-400">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      </div>
      <h3 class="text-sm font-bold text-white mb-1">اثری با این مشخصات یافت نشد</h3>
      <p class="text-xs text-gray-400">لطفاً عبارت دیگری را جستجو کنید.</p>
    </div>
  </main>

  <script>
    const COLLECTION_METADATA = {
      'ghibli': {
        title: 'شاهکارهای هایائو میازاکی و استودیو جیبلی',
        desc: 'تمام آثار بلند سینمایی استودیو جیبلی با دوبله و زیرنویس اختصاصی'
      },
      'animation_hits': {
        title: 'انیمیشن‌های شاهکار دیزنی و پیکسار',
        desc: 'محبوب‌ترین انیمیشن‌های بلند خانوادگی دیزنی و پیکسار'
      },
      'mafia': {
        title: 'سینمای اصیل مافیایی و گانگستری',
        desc: 'برترین فیلم‌های ژانر مافیا و گانگستر در تاریخ سینما'
      },
      'miniseries': {
        title: 'برترین مینی‌سریال‌های تاریخ',
        desc: 'شاهکارهای کوتاه چندقسمتی تلویزیون جهان'
      },
      'nolan': {
        title: 'سینمای کریستوفر نولان',
        desc: 'مجموعه تمام آثار بلند سینمایی کریستوفر نولان'
      },
      'scorsese': {
        title: 'آثار ماندگار مارتین اسکورسیزی',
        desc: 'شاهکارهای سینمایی مارتین اسکورسیزی'
      },
      'tarantino': {
        title: 'سینمای کوئنتین تارانتینو',
        desc: 'مجموعه کامل آثار کوئنتین تارانتینو'
      },
      'fincher': {
        title: 'سینمای دیوید فینچر',
        desc: 'شاهکارهای رمزآلود و نئو-نوآر دیوید فینچر'
      },
      'war_epics': {
        title: 'حماسه‌های جنگی و تاریخی',
        desc: 'بزرگ‌ترین نبردها و فیلم‌های حماسی تاریخ سینما'
      },
      'mindbending': {
        title: 'شاهکارهای روانشناختی و ذهن‌فریب',
        desc: 'فیلم‌هایی با فیلم‌نامه پیچیده و پایان‌های غافلگیرکننده'
      },
      'mystery': {
        title: 'فیلم‌های کارآگاهی و معمایی',
        desc: 'برترین آثار کارآگاهی و حل معماهای جنایی'
      },
      'scifi': {
        title: 'برترین فیلم‌های علمی تخیلی',
        desc: 'سفرهای کهکشانی، هوش مصنوعی و دنیاهای موازی'
      },
      'horror': {
        title: 'ترسناک‌ترین فیلم‌های تاریخ سینما',
        desc: 'دست‌چین شاهکارهای واقعی ژانر وحشت'
      },
      'top_series': {
        title: 'برترین سریال‌های تاریخ تلویزیون',
        desc: 'شاهکارهای چندفصلی با بالاترین امتیاز کاربران جهان'
      },
      'kdrama': {
        title: 'شاهکارهای سینمای کره جنوبی',
        desc: 'برترین فیلم‌های درام و مهیج سینمای کره'
      },
      'lotr': {
        title: 'دنیای ارباب حلقه‌ها و هابیت',
        desc: 'سه‌گانه ارباب حلقه‌ها و سه‌گانه هابیت با کیفیت عالی'
      },
      'batman': {
        title: 'جهان سینمایی بتمن',
        desc: 'تمامی فیلم‌های سینمایی و انیمیشن‌های شوالیه تاریکی'
      },
      'harrypotter': {
        title: 'دنیای جادویی هری پاتر',
        desc: 'مجموعه کامل فیلم‌های هشت‌گانه هری پاتر'
      },
      'marvel': {
        title: 'دنیای سینمایی مارول (MCU)',
        desc: 'مجموعه آثار انتقام‌جویان و ابرقهرمانان مارول'
      },
      'action_hits': {
        title: 'مهیج‌ترین فیلم‌های اکشن تاریخ',
        desc: 'آثار پرهیجان با آدرنالین بی‌وقفه'
      },
      'oscar_winners': {
        title: 'برندگان اسکار بهترین فیلم',
        desc: 'مجموعه فاخر آثار برنده مجسمه طلایی اسکار'
      },
      'drama_classics': {
        title: 'شاهکارهای درام کلاسیک',
        desc: 'عمیق‌ترین و تفکربرانگیزترین درام‌های ماندگار'
      },
      'dicaprio': {
        title: 'آثار برگزیده لئوناردو دی‌کاپریو',
        desc: 'درخشان‌ترین نقش‌آفرینی‌های لئوناردو دی‌کاپریو'
      },
      'keanu': {
        title: 'فیلم‌های برتر کیانو ریوز',
        desc: 'محبوب‌ترین فیلم‌های کیانو ریوز از ماتریکس تا جان ویک'
      },
      'tom_hardy': {
        title: 'آثار برگزیده تام هاردی',
        desc: 'فیلم‌های ماندگار تام هاردی در سینمای جهان'
      },
      'cillian': {
        title: 'آثار برگزیده کیلین مورفی',
        desc: 'بهترین فیلم‌ها و سریال‌های کیلین مورفی'
      },
      'pacino_deniro': {
        title: 'آثار آل پاچینو و رابرت دنیرو',
        desc: 'شاهکارهای دو اسطوره بی‌تکرار تاریخ سینما'
      },
      'dubbed': {
        title: 'عناوین برتر با دوبله اختصاصی پارسی',
        desc: 'برترین آثار با دوبله حرفه‌ای و بدون سانسور'
      },
      'latest_2026': {
        title: 'جدیدترین آثار سال ۲۰۲۵ و ۲۰۲۶',
        desc: 'تازه‌ترین فیلم‌ها و سریال‌های منتشر شده جهانی'
      },
      'anime_series': {
        title: 'محبوب‌ترین انیمه‌های سریالی جهان',
        desc: 'شاهکارهای سریالی انیمه از حمله به تایتان تا دث نوت'
      },
      'comedy_hits': {
        title: 'کمدی‌های خنده‌دار و سرگرم‌کننده',
        desc: 'شادترین و محبوب‌ترین فیلم‌های کمدی سینما'
      },
      'romance_classics': {
        title: 'عاشقانه‌های ماندگار تاریخ سینما',
        desc: 'زیباترین فیلم‌های احساسی و رمانتیک'
      }
    };

    let allItems = [];
    let currentKey = '';

    function getCollectionKeyFromUrl() {
      const params = new URLSearchParams(window.location.search);
      let key = params.get('id');
      if (!key && window.location.hash) {
        key = window.location.hash.replace('#', '').replace('id=', '').replace('collection=', '');
      }
      return key || 'ghibli';
    }

    function createCard(item) {
      const poster = item.poster || 'icon.jpg';
      const titleFa = item.title_fa || item.title_en || 'بدون نام';
      const titleEn = item.title_en || '';
      const year = item.year || '';
      const rating = item.rating || '7.5';

      return `
        <article class="w-full group cursor-pointer" onclick="openItemDetails('${item.slug}')">
          <!-- Standard 2:3 Poster Container -->
          <div class="relative w-full aspect-[2/3] rounded-2xl overflow-hidden bg-surfaceDark border border-white/10 group-hover:border-brandRed/60 transition duration-200 shadow-lg">
            <img src="${poster}" alt="${titleFa}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" onerror="this.src='icon.jpg'">
            <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-transparent pointer-events-none"></div>

            <!-- Rating Badge Top-Left -->
            <div class="absolute top-2 left-2 z-10">
              <span class="px-1.5 py-0.5 rounded-md bg-black/80 backdrop-blur-md text-amber-400 font-bold text-[10px] border border-white/10 flex items-center gap-1 shadow">
                <svg class="w-2.5 h-2.5 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                <span>${rating}</span>
              </span>
            </div>
          </div>

          <!-- Titles Under Card (Persian Bold, English Subtitle) -->
          <div class="mt-2 space-y-0.5">
            <h3 class="text-xs sm:text-sm font-bold text-white group-hover:text-brandRed truncate transition duration-150 leading-snug">
              ${titleFa}
            </h3>
            <div class="flex items-center justify-between text-[11px] text-gray-400">
              <span class="truncate max-w-[65%]">${titleEn}</span>
              <span class="text-gray-300 font-medium">${year}</span>
            </div>
          </div>
        </article>
      `;
    }

    function openItemDetails(slug) {
      window.location.href = 'index.html#item/' + encodeURIComponent(slug);
    }

    function renderItems(list) {
      const grid = document.getElementById('moviesGrid');
      const empty = document.getElementById('emptyState');
      const badge = document.getElementById('resultCountBadge');

      if (!list || list.length === 0) {
        grid.innerHTML = '';
        empty.classList.remove('hidden');
        if (badge) badge.textContent = '۰ مورد';
        return;
      }

      empty.classList.add('hidden');
      grid.innerHTML = list.map(createCard).join('');
      if (badge) badge.textContent = `${list.length.toLocaleString('fa-IR')} اثر`;
    }

    function applySearch() {
      const q = (document.getElementById('searchInput').value || '').trim().toLowerCase();
      if (!q) {
        renderItems(allItems);
        return;
      }

      const filtered = allItems.filter(it => {
        const fa = (it.title_fa || '').toLowerCase();
        const en = (it.title_en || '').toLowerCase();
        const sl = (it.slug || '').toLowerCase();
        const yr = String(it.year || '');
        return fa.includes(q) || en.includes(q) || sl.includes(q) || yr.includes(q);
      });

      renderItems(filtered);
    }

    document.getElementById('searchInput').addEventListener('input', applySearch);

    async function init() {
      currentKey = getCollectionKeyFromUrl();
      if (currentKey === 'top250') {
        window.location.replace('top250.html');
        return;
      }

      const meta = COLLECTION_METADATA[currentKey] || {
        title: 'مجموعه برگزیده',
        desc: 'آثار دست‌چین شده با بالاترین کیفیت و لینک مستقیم'
      };

      document.title = `${meta.title} | Mewvi`;
      const pageHeaderTitle = document.getElementById('pageHeaderTitle');
      if (pageHeaderTitle) pageHeaderTitle.textContent = meta.title;
      const collectionTitle = document.getElementById('collectionTitle');
      if (collectionTitle) collectionTitle.textContent = meta.title;
      const collectionDesc = document.getElementById('collectionDesc');
      if (collectionDesc) collectionDesc.textContent = meta.desc;

      try {
        const res = await fetch('data/home_showcase.json');
        const data = await res.json();
        allItems = (data.collections && data.collections[currentKey]) || data[currentKey] || [];
      } catch(e) {
        try {
          const res2 = await fetch('home_showcase.json');
          const data2 = await res2.json();
          allItems = (data2.collections && data2.collections[currentKey]) || data2[currentKey] || [];
        } catch(e2) {
          console.error('Failed to load showcase data', e2);
        }
      }

      renderItems(allItems);
    }

    init();
  </script>
</body>
</html>
