<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="catHalo" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="redPlayGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B4E"/>
      <stop offset="100%" stop-color="#D90429"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="#08080C"/>
  <rect width="512" height="512" rx="110" fill="url(#catHalo)"/>

  <!-- Outer Border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#EF4444" stroke-opacity="0.2" stroke-width="4"/>

  <!-- Cute Mewvi Cat Silhouette -->
  <g transform="translate(0, -10)">
    <!-- Cat Ears with Red Inner Glow -->
    <path d="M150 200 L185 95 C190 82 205 85 220 115 L245 160 Z" fill="#EF4444" filter="url(#redGlow)"/>
    <path d="M158 195 L188 108 C192 98 202 100 214 125 L235 160 Z" fill="#FF5964"/>
    
    <path d="M362 200 L327 95 C322 82 307 85 292 115 L267 160 Z" fill="#EF4444" filter="url(#redGlow)"/>
    <path d="M354 195 L324 108 C320 98 310 100 298 125 L277 160 Z" fill="#FF5964"/>

    <!-- Cat Head Base -->
    <path d="M140 220 C130 170 170 140 256 140 C342 140 382 170 372 220 C382 280 340 330 256 330 C172 330 130 280 140 220 Z" fill="#0E0E14" stroke="#EF4444" stroke-width="4" stroke-opacity="0.4"/>

    <!-- Cat Cute Smiling Eyes (Curved Arcs) -->
    <path d="M195 205 Q215 190 235 205" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>
    <path d="M277 205 Q297 190 317 205" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round"/>

    <!-- Cute Nose -->
    <polygon points="256,220 250,212 262,212" fill="#FF5964"/>

    <!-- Red Play Button Symbol on Cat -->
    <path d="M228 245 L300 285 L228 325 Z" fill="url(#redPlayGrad)" filter="url(#redGlow)"/>
  </g>

  <!-- Typography: mewvi -->
  <g transform="translate(256, 435)" text-anchor="middle">
    <text font-family="'Vazirmatn', -apple-system, sans-serif" font-weight="900" font-size="62" letter-spacing="1">
      <tspan fill="#FFFFFF">mew</tspan><tspan fill="#EF4444">v</tspan><tspan fill="#FFFFFF">i</tspan>
    </text>
  </g>
</svg>
